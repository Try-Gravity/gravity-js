<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://www.trygravity.ai/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity React SDK Playground</title>
    <meta name="description" content="Explore 25+ ad layout examples for AI platforms. Customize colors, shapes, and disclosure labels, then copy the integration code. Built with the Gravity React SDK." />
    <meta property="og:title" content="Gravity React SDK Playground" />
    <meta property="og:description" content="Explore 25+ ad layout examples for AI platforms. Customize and copy integration code." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://playground.trygravity.ai" />
    <meta property="og:image" content="https://www.trygravity.ai/og-playground.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gravity React SDK Playground" />
    <meta name="twitter:description" content="Explore 25+ ad layout examples for AI platforms. Customize and copy integration code." />
    <meta name="twitter:image" content="https://www.trygravity.ai/og-playground.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root, [data-mode="light"] {
        --bg: #FFFFFF;
        --surface: #FAFAFA;
        --subtle: #F4F4F5;
        --border: #E4E4E7;
        --muted: #71717A;
        --fg: #18181B;
        --accent: #2563EB;

        /* Ad defaults in light mode (match component internals) */
        --ad-bg: #FFFFFF;
        --ad-fg: #18181B;
        --ad-muted: #71717A;
        --ad-border: #E4E4E7;
        --ad-cta: #2563EB;
        --ad-shadow: 0 1px 2px 0 rgba(0,0,0,0.04), 0 1px 6px 0 rgba(0,0,0,0.06);
      }
      [data-mode="dark"] {
        --bg: #09090B;
        --surface: #18181B;
        --subtle: #27272A;
        --border: #3F3F46;
        --muted: #A1A1AA;
        --fg: #FAFAFA;
        --accent: #2563EB;

        /* Ad needs these to look right on dark backgrounds */
        --ad-bg: #18181B;
        --ad-fg: #FAFAFA;
        --ad-muted: #A1A1AA;
        --ad-border: #3F3F46;
        --ad-cta: #2563EB;
        --ad-shadow: 0 1px 4px rgba(0,0,0,0.3);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
        line-height: 1.5;
        transition: background 200ms, color 200ms;
      }
      ::selection { background: rgba(37, 99, 235, 0.3); }
      input[type="range"] {
        -webkit-appearance: none; height: 3px; background: var(--subtle);
        border-radius: 2px; outline: none; width: 100%;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent); cursor: pointer; border: 2px solid var(--bg);
      }
    </style>
  </head>
  <body data-mode="dark">
    <script>try{if(window.matchMedia('(prefers-color-scheme:light)').matches){document.body.setAttribute('data-mode','light');document.documentElement.setAttribute('data-mode','light')}}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
